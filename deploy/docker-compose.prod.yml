# Production stack for a single private server (see deploy/README.md).
#
#   cd deploy && ./setup.sh            # once: generates deploy/.env with secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nothing listens on a public interface: Caddy (the app) binds to 127.0.0.1:8080
# and the n8n editor to 127.0.0.1:5678. Reach them privately through Tailscale
# (`tailscale serve`), Cloudflare Tunnel + Access, or an SSH tunnel.
name: proposalcreator

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proposalcreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/setup.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-proposalcreator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *restart
    build: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-proposalcreator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proposalcreator}
      SECRET_KEY: ${SECRET_KEY:?run deploy/setup.sh first}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CORS_ORIGINS: ""   # browser traffic is same-origin through Caddy
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-7}
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:?run deploy/setup.sh first}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n:
    <<: *restart
    image: docker.n8n.io/n8nio/n8n:2.46.7
    # Imports the shared-secret credential and every workflow in n8n/workflows,
    # publishes them, then starts n8n — no manual setup in the editor.
    entrypoint: ["tini", "--", "/bin/sh", "/init/n8n-init.sh"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run deploy/setup.sh first}
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET}
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      TZ: ${TIMEZONE:-Asia/Kolkata}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # The editor is only reachable privately (tailscale serve gives HTTPS;
      # an SSH tunnel gives plain http://localhost:5678, which needs this off).
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"   # keep 14 days of execution history
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
      - ./n8n-init.sh:/init/n8n-init.sh:ro
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    <<: *restart
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ""   # same origin: the browser calls /api/... on Caddy
    depends_on:
      - backend

  caddy:
    <<: *restart
    image: caddy:2.8.4-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  n8n_data:
  caddy_data:
